on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Yarn
        run: |
          sudo npm i -g corepack
          corepack enable
          corepack install -g yarn@4
      - uses: astral-sh/setup-uv@v7
      - run: yarn
      - run: yarn build
      - run: yarn test
      - run: npm publish
